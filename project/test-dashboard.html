<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Analytics - Test Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .title h1 {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 5px;
        }
        .title p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }
        .stat-card h3 {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .stat-card .value {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #667eea;
        }
        .stat-card .unit {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }
        .charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }
        .chart-container h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #e2e8f0;
        }
        .chart-wrapper {
            position: relative;
            height: 300px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        .error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #86efac;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">
                <h1>Queue Analytics Dashboard</h1>
                <p>Real-time queue monitoring system</p>
            </div>
            <div class="status">
                <div class="status-dot"></div>
                <span id="api-status">Connecting to API...</span>
            </div>
        </div>

        <div id="error-msg" class="error"></div>
        <div id="success-msg" class="success"></div>

        <div class="controls">
            <button onclick="sendTestData()">📊 Send Test Data</button>
            <button onclick="fetchData()">🔄 Refresh Data</button>
            <button onclick="clearData()">🗑️ Clear Data</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>👥 People Count</h3>
                <div class="value" id="people-count">0</div>
                <div class="unit">persons detected</div>
            </div>
            <div class="stat-card">
                <h3>📏 Queue Length</h3>
                <div class="value" id="queue-length">0</div>
                <div class="unit">in queue</div>
            </div>
            <div class="stat-card">
                <h3>➡️ Entries</h3>
                <div class="value" id="entries">0</div>
                <div class="unit">total entries</div>
            </div>
            <div class="stat-card">
                <h3>⬅️ Exits</h3>
                <div class="value" id="exits">0</div>
                <div class="unit">total exits</div>
            </div>
        </div>

        <div class="charts">
            <div class="chart-container">
                <h3>📈 People Count Trend</h3>
                <div class="chart-wrapper">
                    <canvas id="peopleChart"></canvas>
                </div>
            </div>
            <div class="chart-container">
                <h3>📊 Queue Length Trend</h3>
                <div class="chart-wrapper">
                    <canvas id="queueChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api';
        let chartInstances = {};
        let historyData = [];

        async function checkAPIHealth() {
            try {
                const response = await fetch(`${API_URL}/health`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) {
                    document.getElementById('api-status').textContent = 'API Connected ✓';
                    document.querySelector('.status').style.background = 'rgba(34, 197, 94, 0.15)';
                    return true;
                }
            } catch (error) {
                document.getElementById('api-status').textContent = 'API Disconnected ✗';
                document.querySelector('.status').style.background = 'rgba(239, 68, 68, 0.15)';
                showError('Cannot connect to API. Is the backend running on port 8000?');
            }
            return false;
        }

        async function fetchData() {
            try {
                const response = await fetch(`${API_URL}/stats`);
                if (!response.ok) throw new Error('Failed to fetch stats');
                
                const data = await response.json();
                if (data.data) {
                    updateStats(data.data);
                }

                const historyResponse = await fetch(`${API_URL}/history?limit=100`);
                if (historyResponse.ok) {
                    const historyData = await historyResponse.json();
                    if (historyData.data && historyData.data.length > 0) {
                        updateCharts(historyData.data);
                    }
                }
            } catch (error) {
                showError('Failed to fetch data: ' + error.message);
            }
        }

        function updateStats(data) {
            document.getElementById('people-count').textContent = data.people_count || 0;
            document.getElementById('queue-length').textContent = data.queue_length || 0;
            document.getElementById('entries').textContent = data.entry_count || 0;
            document.getElementById('exits').textContent = data.exit_count || 0;
        }

        function updateCharts(data) {
            const labels = data.map(d => new Date(d.created_at).toLocaleTimeString()).slice(-20);
            const peopleData = data.map(d => d.people_count).slice(-20);
            const queueData = data.map(d => d.queue_length).slice(-20);

            if (chartInstances.peopleChart) chartInstances.peopleChart.destroy();
            if (chartInstances.queueChart) chartInstances.queueChart.destroy();

            chartInstances.peopleChart = new Chart(document.getElementById('peopleChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'People Count',
                        data: peopleData,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#e2e8f0' } } },
                    scales: {
                        y: { ticks: { color: '#a0aec0' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        x: { ticks: { color: '#a0aec0' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });

            chartInstances.queueChart = new Chart(document.getElementById('queueChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Queue Length',
                        data: queueData,
                        borderColor: '#f093fb',
                        backgroundColor: 'rgba(240, 147, 251, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#e2e8f0' } } },
                    scales: {
                        y: { ticks: { color: '#a0aec0' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        x: { ticks: { color: '#a0aec0' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        }

        async function sendTestData() {
            const testData = {
                people_count: Math.floor(Math.random() * 20) + 1,
                queue_length: Math.floor(Math.random() * 10),
                entry_count: Math.floor(Math.random() * 50) + 1,
                exit_count: Math.floor(Math.random() * 50),
                timestamp: new Date().toISOString()
            };

            try {
                const response = await fetch(`${API_URL}/analytics`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(testData)
                });

                if (response.ok) {
                    showSuccess('Test data sent successfully!');
                    setTimeout(fetchData, 500);
                } else {
                    throw new Error('API returned error');
                }
            } catch (error) {
                showError('Failed to send test data: ' + error.message);
            }
        }

        async function clearData() {
            if (confirm('Clear all data? This cannot be undone.')) {
                location.reload();
            }
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        function showSuccess(msg) {
            const el = document.getElementById('success-msg');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        // Initialize
        checkAPIHealth();
        fetchData();
        setInterval(fetchData, 2000); // Refresh every 2 seconds
    </script>
</body>
</html>
